name: Contract Tests
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'backend-rs/src/**'
      - 'specs/**'

jobs:
  # ── 1. OpenAPI Spec 校验 ──────────────────────────────────────────
  spec-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenAPI spec
        run: |
          pip install pyyaml
          python contract-tests/validate_spec.py

  # ── 2. Python 契约测试（语法 + 端点发现验证） ──────────────────────
  python-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          pip install pyyaml pytest requests
      - name: Validate spec and test discovery
        run: |
          python contract-tests/discover_endpoints.py

  # ── 3. Rust 内部契约测试 ──────────────────────────────────────────
  rust-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust
        run: cargo build --manifest-path backend-rs/Cargo.toml
      - name: Start Rust server
        run: |
          cd backend-rs
          cargo run &
          # 健康检查循环，替代固定 sleep
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "Rust 服务就绪（${i}s）"
              break
            fi
            sleep 1
          done
      - name: Run contract tests
        run: |
          cargo test --manifest-path backend-rs/Cargo.toml --test contract_tests
