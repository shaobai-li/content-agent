# /api/agents/{agent_id}/sessions/{session_id}/messages

paths:
  /api/agents/{agent_id}/sessions/{session_id}/messages:
    get:
      x-status: ported
      x-rust-path: /api/agents/:agent_id/sessions/:session_id/messages
      summary: 获取会话消息列表
      operationId: getMessages
      tags: [messages]
      parameters:
        - $ref: "../components/parameters.yaml#/AgentId"
        - $ref: "../components/parameters.yaml#/SessionId"
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/Message"
