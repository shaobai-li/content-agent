# /api/agents/{agent_id}/attachments/cache

paths:
  /api/agents/{agent_id}/attachments/cache:
    post:
      x-status: ported
      x-rust-path: /api/agents/:agent_id/attachments/cache
      summary: 上传文件到 Agent 缓存
      operationId: uploadAttachment
      tags: [files]
      parameters:
        - $ref: "../components/parameters.yaml#/AgentId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功，返回缓存路径
          content:
            application/json:
              schema:
                type: object
                required: [cached_path]
                properties:
                  cached_path:
                    type: string

  /api/agents/{agent_id}/files/tree:
    get:
      x-status: ported
      x-rust-path: /api/agents/:agent_id/files/tree
      summary: 获取 Agent workspace 目录树
      operationId: getWorkspaceTree
      tags: [files]
      parameters:
        - $ref: "../components/parameters.yaml#/AgentId"
      responses:
        "200":
          description: workspace 目录树
          content:
            application/json:
              schema:
                type: object
                required: [tree]
                properties:
                  tree:
                    $ref: "../components/schemas.yaml#/FileNode"

  /api/agents/{agent_id}/files/content:
    get:
      x-status: ported
      x-rust-path: /api/agents/:agent_id/files/content
      summary: 读取 Agent workspace 内文件文本内容
      operationId: getWorkspaceFileContent
      tags: [files]
      parameters:
        - $ref: "../components/parameters.yaml#/AgentId"
        - $ref: "../components/parameters.yaml#/FilePath"
      responses:
        "200":
          description: 文件内容
          content:
            application/json:
              schema:
                type: object
                required: [path, content]
                properties:
                  path:
                    type: string
                  content:
                    type: string
