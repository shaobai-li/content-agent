# /api/agents/{agent_id}/sessions

paths:
  /api/agents/{agent_id}/sessions:
    get:
      x-status: ported
      x-rust-path: /api/agents/:agent_id/sessions
      summary: 获取会话列表
      operationId: getSessions
      tags: [sessions]
      parameters:
        - $ref: "../components/parameters.yaml#/AgentId"
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/Session"

  /api/agents/{agent_id}/sessions/{session_id}:
    delete:
      x-status: ported
      x-rust-path: /api/agents/:agent_id/sessions/:session_id
      summary: 删除会话
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - $ref: "../components/parameters.yaml#/AgentId"
        - $ref: "../components/parameters.yaml#/SessionId"
      responses:
        "200":
          $ref: "../components/responses.yaml#/Success"
