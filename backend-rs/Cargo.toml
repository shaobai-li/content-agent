[package]
name = "omniage-backend-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "omniage_backend_rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
once_cell = "1"
regex = "1"
tokio-stream = "0.1"
encoding_rs = "0.8"

# Document parsing (import_knowledge tool)
sha2 = "0.10"
pdf-extract = "0.7"
lopdf = "0.34"
zip = "2"
quick-xml = "0.36"

[dev-dependencies]
tempfile = "3"
