[package]
name = "omniage-backend-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "omniage_backend_rs"

[features]
default = []
# Tauri 桌面端：将 Python 解释器嵌入 Rust 进程
embedded-python = ["dep:pyo3", "dep:python3-dll-a"]

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
once_cell = "1"
regex = "1"
tokio-stream = "0.1"
encoding_rs = "0.8"

# Document parsing (import_knowledge tool)
sha2 = "0.10"
pdf-extract = "0.7"
zip = "2"
quick-xml = "0.36"

# Python 嵌入式解释器（可选，仅 Tauri 桌面端启用）
pyo3 = { version = "0.23", optional = true, default-features = false, features = [
    "auto-initialize",
    "macros",
] }
# Windows 上辅助定位 python3.dll
python3-dll-a = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
